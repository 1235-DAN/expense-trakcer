<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>記帳本 - 收支管理</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:wght@300;600&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --bg-main: #f8f6f1;
            --bg-card: #ffffff;
            --text-primary: #2c2416;
            --text-secondary: #6b5d4f;
            --income-color: #2d5f3f;
            --expense-color: #8b3a3a;
            --border-color: #d4cbb8;
            --accent: #c9a961;
            --shadow: rgba(44, 36, 22, 0.08);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Noto Sans TC', sans-serif;
            background: var(--bg-main);
            color: var(--text-primary);
            line-height: 1.6;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: url('https://images.unsplash.com/photo-1554224155-8d04cb21cd6c?w=1920');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            filter: brightness(0.3);
            z-index: -1;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 40px 20px;
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--border-color);
            box-shadow: 0 8px 24px var(--shadow);
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(201, 169, 97, 0.05) 0%, transparent 70%);
            animation: rotate 30s linear infinite;
            pointer-events: none;
            z-index: 0;
        }

        @keyframes rotate {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        h1 {
            font-family: 'Crimson Pro', serif;
            font-size: 3.5rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 10px;
            position: relative;
            letter-spacing: 0.05em;
            z-index: 1;
        }

        .subtitle {
            font-size: 1.1rem;
            color: var(--text-secondary);
            font-weight: 300;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            position: relative;
            z-index: 1;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 40px;
        }

        .card {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--border-color);
            padding: 30px;
            box-shadow: 0 4px 16px var(--shadow);
            transition: all 0.3s ease;
        }

        .card:hover {
            box-shadow: 0 8px 32px var(--shadow);
            transform: translateY(-2px);
        }

        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 25px;
            padding-bottom: 15px;
            border-bottom: 2px solid var(--border-color);
        }

        .card-icon {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            font-weight: bold;
        }

        .income .card-icon {
            background: var(--income-color);
            color: white;
        }

        .expense .card-icon {
            background: var(--expense-color);
            color: white;
        }

        .card-title {
            font-family: 'Crimson Pro', serif;
            font-size: 1.8rem;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 700;
            color: var(--text-secondary);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        input, select {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid var(--border-color);
            background: var(--bg-main);
            font-size: 1rem;
            font-family: 'Noto Sans TC', sans-serif;
            transition: all 0.2s ease;
        }

        input:focus, select:focus {
            outline: none;
            border-color: var(--accent);
            background: white;
        }

        button {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--text-primary);
            background: var(--text-primary);
            color: var(--bg-card);
            font-size: 1rem;
            font-weight: 700;
            font-family: 'Noto Sans TC', sans-serif;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            position: relative;
            overflow: hidden;
        }

        button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            border-radius: 50%;
            background: var(--accent);
            transition: width 0.6s, height 0.6s, top 0.6s, left 0.6s;
            transform: translate(-50%, -50%);
            z-index: 0;
        }

        button:hover::before {
            width: 300px;
            height: 300px;
        }

        button span {
            position: relative;
            z-index: 1;
        }

        button:hover {
            border-color: var(--accent);
        }

        .summary {
            background: rgba(255, 255, 255, 0.95);
            border: 2px solid var(--border-color);
            padding: 40px;
            margin-bottom: 40px;
            box-shadow: 0 4px 16px var(--shadow);
        }

        .summary-header {
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-box {
            padding: 25px;
            text-align: center;
            border: 2px solid var(--border-color);
            background: var(--bg-main);
            transition: all 0.3s ease;
        }

        .stat-box:hover {
            transform: translateY(-4px);
            box-shadow: 0 6px 20px var(--shadow);
        }

        .stat-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.1em;
            margin-bottom: 10px;
        }

        .stat-value {
            font-family: 'Crimson Pro', serif;
            font-size: 2rem;
            font-weight: 600;
            color: var(--text-primary);
        }

        .stat-box.income .stat-value {
            color: var(--income-color);
        }

        .stat-box.expense .stat-value {
            color: var(--expense-color);
        }

        .filter-section {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            align-items: flex-end;
        }

        .filter-group {
            flex: 1;
        }

        .records-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid var(--border-color);
        }

        .records-header {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
        }

        .record-item {
            display: grid;
            grid-template-columns: 120px 1fr 150px 100px 80px;
            gap: 20px;
            padding: 20px;
            margin-bottom: 12px;
            border: 1px solid var(--border-color);
            background: var(--bg-main);
            align-items: center;
            transition: all 0.2s ease;
            animation: slideIn 0.4s ease;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .record-item:hover {
            background: white;
            transform: translateX(4px);
            box-shadow: -4px 0 0 var(--accent);
        }

        .record-date {
            font-weight: 700;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }

        .record-description {
            font-size: 1.05rem;
        }

        .record-amount {
            font-family: 'Crimson Pro', serif;
            font-size: 1.4rem;
            font-weight: 600;
            text-align: right;
        }

        .record-item.income .record-amount {
            color: var(--income-color);
        }

        .record-item.expense .record-amount {
            color: var(--expense-color);
        }

        .record-type {
            font-size: 0.8rem;
            padding: 6px 12px;
            border-radius: 20px;
            text-align: center;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .record-item.income .record-type {
            background: rgba(45, 95, 63, 0.1);
            color: var(--income-color);
            border: 1px solid var(--income-color);
        }

        .record-item.expense .record-type {
            background: rgba(139, 58, 58, 0.1);
            color: var(--expense-color);
            border: 1px solid var(--expense-color);
        }

        .delete-btn {
            width: auto;
            padding: 8px 16px;
            background: transparent;
            color: var(--expense-color);
            border: 1px solid var(--expense-color);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .delete-btn:hover {
            background: var(--expense-color);
            color: white;
        }

        .delete-btn::before {
            display: none;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-secondary);
            font-style: italic;
        }

        .charts-section {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid var(--border-color);
        }

        .charts-header {
            font-family: 'Crimson Pro', serif;
            font-size: 1.5rem;
            font-weight: 600;
            margin-bottom: 25px;
            text-align: center;
        }

        .charts-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 30px;
            margin-bottom: 30px;
        }

        .chart-container {
            background: rgba(255, 255, 255, 0.95);
            padding: 25px;
            border: 2px solid var(--border-color);
            border-radius: 4px;
            box-shadow: 0 4px 16px var(--shadow);
        }

        .chart-container.full-width {
            grid-column: span 2;
        }

        .chart-title {
            font-weight: 700;
            font-size: 1.1rem;
            margin-bottom: 20px;
            text-align: center;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        canvas {
            max-height: 300px;
        }

        @media (max-width: 768px) {
            .main-grid {
                grid-template-columns: 1fr;
            }

            .stats-grid {
                grid-template-columns: 1fr;
            }

            .record-item {
                grid-template-columns: 1fr;
                gap: 10px;
            }

            .record-amount, .record-type {
                text-align: left;
            }

            h1 {
                font-size: 2.5rem;
            }

            .filter-section {
                flex-direction: column;
            }

            .charts-grid {
                grid-template-columns: 1fr;
            }

            .chart-container.full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>記帳本</h1>
            <div class="subtitle">Make Wise Use of Your Money</div>
        </header>

        <div class="main-grid">
            <!-- 收入表單 -->
            <div class="card income">
                <div class="card-header">
                    <div class="card-icon">+</div>
                    <div class="card-title">收入</div>
                </div>
                <form id="incomeForm">
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="incomeDate" required>
                    </div>
                    <div class="form-group">
                        <label>項目</label>
                        <input type="text" id="incomeItem" placeholder="例如：薪資、獎金" required>
                    </div>
                    <div class="form-group">
                        <label>金額</label>
                        <input type="number" id="incomeAmount" placeholder="0" min="0" step="1" required>
                    </div>
                    <button type="submit"><span>新增收入</span></button>
                </form>
            </div>

            <!-- 支出表單 -->
            <div class="card expense">
                <div class="card-header">
                    <div class="card-icon">−</div>
                    <div class="card-title">支出</div>
                </div>
                <form id="expenseForm">
                    <div class="form-group">
                        <label>日期</label>
                        <input type="date" id="expenseDate" required>
                    </div>
                    <div class="form-group">
                        <label>項目</label>
                        <input type="text" id="expenseItem" placeholder="例如：飲食、交通" required>
                    </div>
                    <div class="form-group">
                        <label>金額</label>
                        <input type="number" id="expenseAmount" placeholder="0" min="0" step="1" required>
                    </div>
                    <button type="submit"><span>新增支出</span></button>
                </form>
            </div>
        </div>

        <!-- 統計摘要 -->
        <div class="summary">
            <div class="summary-header">財務總覽</div>
            <div class="filter-section">
                <div class="filter-group">
                    <label>篩選年度</label>
                    <select id="yearFilter">
                        <option value="">全部年度</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label>篩選月份</label>
                    <select id="monthFilter">
                        <option value="">全部月份</option>
                        <option value="1">一月</option>
                        <option value="2">二月</option>
                        <option value="3">三月</option>
                        <option value="4">四月</option>
                        <option value="5">五月</option>
                        <option value="6">六月</option>
                        <option value="7">七月</option>
                        <option value="8">八月</option>
                        <option value="9">九月</option>
                        <option value="10">十月</option>
                        <option value="11">十一月</option>
                        <option value="12">十二月</option>
                    </select>
                </div>
            </div>
            <div class="stats-grid">
                <div class="stat-box income">
                    <div class="stat-label">總收入</div>
                    <div class="stat-value" id="totalIncome">$0</div>
                </div>
                <div class="stat-box expense">
                    <div class="stat-label">總支出</div>
                    <div class="stat-value" id="totalExpense">$0</div>
                </div>
                <div class="stat-box">
                    <div class="stat-label">淨收支</div>
                    <div class="stat-value" id="netBalance">$0</div>
                </div>
            </div>

            <!-- 所有記錄（合併在財務總覽之下） -->
            <div class="records-section">
                <div class="records-header">所有記錄</div>
                <div id="recordsList"></div>
            </div>

            <!-- 圖表分析區域 -->
            <div class="charts-section">
                <div class="charts-header">數據分析</div>
                
                <div class="charts-grid">
                    <!-- 長條圖 -->
                    <div class="chart-container full-width">
                        <div class="chart-title">年度月收支趨勢</div>
                        <canvas id="barChart"></canvas>
                    </div>
                    
                    <!-- 收入折線圖 -->
                    <div class="chart-container">
                        <div class="chart-title">收入趨勢</div>
                        <canvas id="incomeLineChart"></canvas>
                    </div>

                    <!-- 支出折線圖 -->
                    <div class="chart-container">
                        <div class="chart-title">支出趨勢</div>
                        <canvas id="expenseLineChart"></canvas>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // 初始化數據 - 從 localStorage 載入
        let records = JSON.parse(localStorage.getItem('expenseTrackerRecords')) || [];
        
        // 圖表實例
        let barChart = null;
        let incomeLineChart = null;
        let expenseLineChart = null;

        // 頁面載入時設定
        window.addEventListener('DOMContentLoaded', function() {
            // 設定今日日期為預設值
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('incomeDate').value = today;
            document.getElementById('expenseDate').value = today;

            // 初始化年度選項（2000年到當前年份+1年）
            initYearOptions();

            // 收入表單提交
            document.getElementById('incomeForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const record = {
                    id: Date.now(),
                    type: 'income',
                    date: document.getElementById('incomeDate').value,
                    item: document.getElementById('incomeItem').value,
                    amount: parseFloat(document.getElementById('incomeAmount').value)
                };
                records.push(record);
                saveRecords();
                this.reset();
                document.getElementById('incomeDate').value = today;
                updateDisplay();
            });

            // 支出表單提交
            document.getElementById('expenseForm').addEventListener('submit', function(e) {
                e.preventDefault();
                const record = {
                    id: Date.now(),
                    type: 'expense',
                    date: document.getElementById('expenseDate').value,
                    item: document.getElementById('expenseItem').value,
                    amount: parseFloat(document.getElementById('expenseAmount').value)
                };
                records.push(record);
                saveRecords();
                this.reset();
                document.getElementById('expenseDate').value = today;
                updateDisplay();
            });

            // 篩選器事件監聽
            document.getElementById('yearFilter').addEventListener('change', updateDisplay);
            document.getElementById('monthFilter').addEventListener('change', updateDisplay);

            // 初始化圖表
            initCharts();

            // 初始顯示
            updateDisplay();
        });

        // 儲存記錄到 localStorage
        function saveRecords() {
            localStorage.setItem('expenseTrackerRecords', JSON.stringify(records));
        }

        // 初始化年度選項（當前年份前後10年）
        function initYearOptions() {
            const yearFilter = document.getElementById('yearFilter');
            const currentYear = new Date().getFullYear();
            const startYear = currentYear - 10;
            const endYear = currentYear + 10;
            
            yearFilter.innerHTML = '<option value="">全部年度</option>';
            
            // 從未來10年倒序到過去10年
            for (let year = endYear; year >= startYear; year--) {
                const option = document.createElement('option');
                option.value = year;
                option.textContent = year + '年';
                yearFilter.appendChild(option);
            }
        }

        // 篩選記錄
        function getFilteredRecords() {
            const yearFilter = document.getElementById('yearFilter').value;
            const monthFilter = document.getElementById('monthFilter').value;

            return records.filter(record => {
                const recordDate = new Date(record.date);
                const yearMatch = !yearFilter || recordDate.getFullYear() == yearFilter;
                const monthMatch = !monthFilter || (recordDate.getMonth() + 1) == monthFilter;
                return yearMatch && monthMatch;
            });
        }

        // 計算統計
        function calculateStats() {
            const filtered = getFilteredRecords();
            const income = filtered.filter(r => r.type === 'income').reduce((sum, r) => sum + r.amount, 0);
            const expense = filtered.filter(r => r.type === 'expense').reduce((sum, r) => sum + r.amount, 0);
            const balance = income - expense;

            document.getElementById('totalIncome').textContent = '$' + income.toLocaleString();
            document.getElementById('totalExpense').textContent = '$' + expense.toLocaleString();
            document.getElementById('netBalance').textContent = '$' + balance.toLocaleString();
            
            const netBalanceEl = document.getElementById('netBalance');
            netBalanceEl.style.color = balance >= 0 ? 'var(--income-color)' : 'var(--expense-color)';
        }

        // 刪除記錄
        function deleteRecord(recordId) {
            if (confirm('確定要刪除這筆記錄嗎？')) {
                records = records.filter(r => r.id !== recordId);
                saveRecords();
                updateDisplay();
            }
        }

        // 顯示記錄
        function displayRecords() {
            const filtered = getFilteredRecords();
            const recordsList = document.getElementById('recordsList');
            
            if (filtered.length === 0) {
                recordsList.innerHTML = '<div class="empty-state">尚無記錄，請開始記帳</div>';
                return;
            }

            // 按日期排序（最新的在前）
            const sorted = filtered.sort((a, b) => new Date(b.date) - new Date(a.date));
            
            recordsList.innerHTML = sorted.map(record => `
                <div class="record-item ${record.type}">
                    <div class="record-date">${record.date}</div>
                    <div class="record-description">${record.item}</div>
                    <div class="record-amount">${record.type === 'income' ? '+' : '-'}$${record.amount.toLocaleString()}</div>
                    <div class="record-type">${record.type === 'income' ? '收入' : '支出'}</div>
                    <button class="delete-btn" onclick="deleteRecord(${record.id})">刪除</button>
                </div>
            `).join('');
        }

        // 更新顯示
        function updateDisplay() {
            calculateStats();
            displayRecords();
            updateCharts();
        }

        // 初始化圖表
        function initCharts() {
            // 長條圖 - 收入與支出並排（都是正值）
            const barCtx = document.getElementById('barChart').getContext('2d');
            barChart = new Chart(barCtx, {
                type: 'bar',
                data: {
                    labels: ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'],
                    datasets: [
                        {
                            label: '收入',
                            data: Array(12).fill(0),
                            backgroundColor: 'rgba(45, 95, 63, 0.8)',
                            borderColor: 'rgba(45, 95, 63, 1)',
                            borderWidth: 2
                        },
                        {
                            label: '支出',
                            data: Array(12).fill(0),
                            backgroundColor: 'rgba(139, 58, 58, 0.8)',
                            borderColor: 'rgba(139, 58, 58, 1)',
                            borderWidth: 2
                        }
                    ]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    scales: {
                        y: {
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return '$' + value.toLocaleString();
                                },
                                font: {
                                    family: "'Noto Sans TC', sans-serif"
                                }
                            }
                        },
                        x: {
                            ticks: {
                                font: {
                                    family: "'Noto Sans TC', sans-serif"
                                }
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                font: {
                                    family: "'Noto Sans TC', sans-serif",
                                    size: 14
                                },
                                padding: 15
                            }
                        },
                        tooltip: {
                            callbacks: {
                                label: function(context) {
                                    const label = context.dataset.label || '';
                                    const value = context.parsed.y || 0;
                                    return label + ': $' + value.toLocaleString();
                                }
                            }
                        }
                    }

        // 更新圖表
        function updateCharts() {
            const filtered = getFilteredRecords();
            
            // 計算長條圖和折線圖數據（按選定年份的月份統計）
            const selectedYear = document.getElementById('yearFilter').value;
            const monthlyIncome = Array(12).fill(0);
            const monthlyExpense = Array(12).fill(0);

            // 如果有選擇年份，只顯示該年份的數據
            const recordsForCharts = selectedYear 
                ? records.filter(r => new Date(r.date).getFullYear() == selectedYear)
                : records;

            recordsForCharts.forEach(record => {
                const month = new Date(record.date).getMonth();
                if (record.type === 'income') {
                    monthlyIncome[month] += record.amount;
                } else {
                    monthlyExpense[month] += record.amount;
                }
            });

            // 更新長條圖（收入和支出都是正值）
            barChart.data.datasets[0].data = monthlyIncome;
            barChart.data.datasets[1].data = monthlyExpense;
            barChart.update();

            // 更新收入折線圖
            incomeLineChart.data.datasets[0].data = monthlyIncome;
            incomeLineChart.update();

            // 更新支出折線圖
            expenseLineChart.data.datasets[0].data = monthlyExpense;
            expenseLineChart.update();
        }
    </script>
